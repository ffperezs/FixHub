spring:
  application:
    name: fixhub

  # Configuración de conexión a PostgreSQL (Docker)
  datasource:
    url: "jdbc:postgresql://localhost:5432/fixhub?options=-c%20timezone=UTC"
    username: fixhub
    password: fixhub
    driver-class-name: org.postgresql.Driver

  # Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Configuración de migraciones con Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration